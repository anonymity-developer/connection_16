name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Install browser and Korean fonts
        run: |
          # The runner's Azure HTTP mirror throttled font packages and exhausted the job timeout.
          # Keep the same browser/fonts and checks, using Ubuntu's HTTPS archive with bounded retries.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80tagme-ci-network > /dev/null
          npx playwright install --with-deps chromium
          sudo apt-get install --yes fonts-noto-cjk
      - name: Check production layouts and development-only interactions
        run: npm run test:ui
      - name: Check authentication browser contracts
        run: npm run test:auth-ui
      - name: Check error reports and administrator member controls
        run: npm run test:support-ui
      - name: Check NFC authentication and legacy SHOW ME return paths
        run: npm run test:auth-nfc-ui
      - name: Check participation browser contracts
        run: npm run test:participation-ui
      - name: Check result missions in the browser
        run: npm run test:results-ui
      - name: Check moderated content in the browser
        run: npm run test:content-ui
      - name: Check comments and hearts in the browser
        run: npm run test:reactions-ui
      - name: Check discovery and profile visits in the browser
        run: npm run test:discovery-ui
      - name: Check operations permissions and review workflow
        run: npm run test:operations-ui
      - name: Check provisional awards and result exports
        run: npm run test:awards-ui && npm run test:post-event-ui
      - name: Check independent admin login, analytics and isolated previews
        run: npm run test:admin-ui
      - name: Inspect production app with Taste
        run: |
          npm run preview -- --port 4173 > /tmp/tagme-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --retry 5 --retry-connrefused --retry-delay 1 --max-time 3 --fail http://127.0.0.1:4173/ > /dev/null
          chrome_executable="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          # Match Playwright's browser sandbox setting on the ephemeral runner.
          # This launcher is used only to inspect this repository's local UI.
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox "$@"\n' "$chrome_executable" > /tmp/tagme-taste-chrome
          chmod +x /tmp/tagme-taste-chrome
          export CHROME_PATH=/tmp/tagme-taste-chrome
          cd ..
          node scripts/taste.mjs lint --app frontend/src
          node scripts/taste.mjs inspect http://127.0.0.1:4173 --app --widths 1440,768,390 --out .taste-skill/production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-ui-review
          path: |
            output/playwright/
            .taste-skill/production/
            .taste-skill/operations-render/
            .taste-skill/profile-render/
          include-hidden-files: true

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test integrationTest bootJar
      - name: Reject fixture classes in the ordinary API archive
        run: python3 ../scripts/deploy/verify-api-archive.py build/libs/app.jar
      - name: Check isolated fixture startup guards
        run: |
          ./gradlew --no-daemon test -PdevFixtures=true --tests com.tagme.devfixture.DevFixtureSafetyTest
          ./gradlew --no-daemon integrationTest -PdevFixtures=true --tests 'com.tagme.devfixture.*IntegrationTest'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_PASSWORD: ci-only-password
      DB_ROOT_PASSWORD: ci-only-root-password
      APP_DOMAIN: tagme.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate development and production Compose
        run: |
          docker compose -f compose.yml -f compose.dev.yml --profile app config --quiet
          docker compose -f compose.yml -f compose.prod.yml --profile app config --quiet
          docker compose -f compose.yml -f compose.dev.yml -f compose.small.yml --profile app config --quiet
          docker compose -f compose.yml -f compose.prod.yml -f compose.small.yml --profile app config --quiet
          docker compose --project-name tagme-fixtures -f compose.yml -f compose.dev.yml -f compose.fixtures.yml --profile app config --quiet
      - name: Check deployment boundaries and private/public image configurations
        env:
          TAGME_IMAGE_TAG: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-1-1
        run: |
          python3 -m unittest discover -s scripts/deploy -p '*_test.py' -v
          bash -n infra/ec2/bootstrap.sh
          bash -n infra/ec2/deploy.sh
          docker compose -f compose.yml -f compose.small.yml -f compose.images.yml --profile app config --quiet
          docker compose -f compose.yml -f compose.prod.yml -f compose.small.yml -f compose.images.yml --profile app config --quiet
      - name: Check deploy failure handling in a disposable host
        run: >-
          docker run --rm
          -v "$PWD/infra/ec2:/source/infra/ec2:ro"
          -v "$PWD/scripts/deploy:/source/scripts/deploy:ro"
          -v "$PWD/.env.production.example:/source/.env.production.example:ro"
          -w /source python:3.12-slim python3 scripts/deploy/host_checks.py
      - name: Build and start full development stack
        run: docker compose -f compose.yml -f compose.dev.yml --profile app up -d --build --wait --wait-timeout 180
      - name: Check browser proxy and API metadata
        run: bash scripts/smoke.sh http://localhost:8088
      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose --profile app ps
          docker compose --profile app logs --tail=100
      - name: Stop ephemeral CI services
        if: always()
        run: docker compose --profile app down -v
