name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test integrationTest bootJar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_PASSWORD: ci-only-password
      DB_ROOT_PASSWORD: ci-only-root-password
      APP_DOMAIN: tagme.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate development and production Compose
        run: |
          docker compose -f compose.yml -f compose.dev.yml --profile app config --quiet
          docker compose -f compose.yml -f compose.prod.yml --profile app config --quiet
      - name: Build and start full development stack
        run: docker compose -f compose.yml -f compose.dev.yml --profile app up -d --build --wait --wait-timeout 180
      - name: Check browser proxy and API metadata
        run: bash scripts/smoke.sh http://localhost:8088
      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose --profile app ps
          docker compose --profile app logs --tail=100
      - name: Stop ephemeral CI services
        if: always()
        run: docker compose --profile app down -v
