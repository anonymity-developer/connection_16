openapi: 3.1.0
info:
  title: TAG ME 동료 탐색과 프로필 방문 API
  version: 0.5.4
  description: 목록은 닉네임/관심사/유형. 가져온 이름·지역·반·사진과 선택 입력 정보는 OPEN 기간 상세에서만 제공. 비공개 설정 없음. 계정/현재 정책/가져오기 조건 필수.
servers:
- url: /api/v1
paths:
  /discovery/people:
    get:
      summary: 현재 공개 동료의 닉네임 목록; 상세 없음
      security: &id001
      - session: []
      responses: &id002
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/People'
        default:
          $ref: '#/components/responses/Error'
      parameters: &id003
      - name: cursor
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 20
      - name: q
        in: query
        schema:
          type: string
          maxLength: 30
      - name: interestId
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: typeCode
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{1,4}$
      - name: questionnaireVersion
        in: query
        schema:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
      description: typeCode/questionnaireVersion은 둘 다 주거나 둘 다 생략. 닉네임만 문자 그대로 검색. 현재 본인 공개 프로필/동의 필요.
  /profiles:
    get:
      summary: 닉네임 목록 별칭; 상세 없음
      security: *id001
      responses: *id002
      parameters: *id003
      description: typeCode/questionnaireVersion은 둘 다 주거나 둘 다 생략. 닉네임만 문자 그대로 검색. 현재 본인 공개 프로필/동의 필요.
  /discovery/recommendations:
    get:
      summary: 관심사·성향·교류·미방문·다른 반 가산점으로 최대 12명
      description: weighted-v2 정책의 합산 점수순. 점수와 익명 교류 근거는 응답에 포함하지 않음. seed는 동점 순서만 변경하며 같은 데이터와 seed에서는 같은 결과.
      parameters:
      - name: seed
        in: query
        description: 동점 후보 추첨 묶음. 생략 시 initial. 인증 토큰이 아니며 방문을 생성하지 않음.
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]{1,64}$
      security:
      - session: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
                maxItems: 12
        default:
          $ref: '#/components/responses/Error'
  /discovery/profiles/{id}/open:
    post:
      summary: 현재 공개 상세와 최초 방문; OPEN 기간에만, 사용자 정렬 잠금/자연 키 멱등
      security:
      - session: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
  /discovery/stats:
    get:
      summary: 현재 공개 가능한 전체 직접 상대 집계
      security:
      - session: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        default:
          $ref: '#/components/responses/Error'
  /discovery/graph:
    get:
      summary: 본인과 직접 연결된 공개 관계만
      security:
      - session: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 20
      - name: offset
        in: query
        description: 현재 관계 강도 순서에서 건너뛸 인원 수
        schema:
          type: integer
          minimum: 0
          default: 0
  /discovery/profiles/{id}/photo:
    get:
      summary: 열어 본 참여자의 Mattermost 사진
      description: OPEN, 본인·대상 현재 자격과 기존 상세 방문 필요. 사진 GET은 방문을 생성하지 않는다. 외부 통신 후 자격 재검사. 사진 없음/미방문 404, 외부 오류 503,
        분당 60회.
      security:
      - session: []
      responses:
        '200':
          description: no-store/nosniff PNG, 최대 1MiB
          content:
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: TAGME_SESSION
  schemas:
    Interest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      required:
      - id
      - name
    Type:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        title:
          type: string
        version:
          type: string
      required:
      - code
      - title
      - version
    Person:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        interests:
          type: array
          items:
            $ref: '#/components/schemas/Interest'
        type:
          anyOf:
          - $ref: '#/components/schemas/Type'
          - type: 'null'
        sharedInterests:
          type: array
          items:
            type: string
        sameType: &id004
          type: boolean
        visited: *id004
        visitedMe: *id004
        mutual: *id004
      required:
      - id
      - nickname
      - interests
      - type
      - sharedInterests
      - sameType
      - visited
      - visitedMe
      - mutual
    People:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        nextCursor:
          type:
          - integer
          - 'null'
          format: int64
      required:
      - items
      - nextCursor
    Detail:
      type: object
      additionalProperties: false
      properties:
        person:
          $ref: '#/components/schemas/Person'
        realName:
          type: string
        region:
          type: string
        classNo:
          type: integer
        bio:
          type:
          - string
          - 'null'
        githubUrl:
          type:
          - string
          - 'null'
        blogUrl:
          type:
          - string
          - 'null'
        newlyVisited: *id004
        photoUrl:
          type:
          - string
          - 'null'
          description: 같은 origin /api/v1/discovery/profiles/{id}/photo?v=숫자, 사진이 없으면 null
      required:
      - person
      - realName
      - region
      - classNo
      - bio
      - githubUrl
      - blogUrl
      - newlyVisited
      - photoUrl
    Stats:
      type: object
      additionalProperties: false
      properties:
        visitedCount:
          type: integer
          format: int64
          minimum: 0
        visitorCount:
          type: integer
          format: int64
          minimum: 0
        mutualCount:
          type: integer
          format: int64
          minimum: 0
      required:
      - visitedCount
      - visitorCount
      - mutualCount
    Self:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
      required:
      - id
      - nickname
    Edge:
      type: object
      additionalProperties: false
      properties:
        weight:
          type: integer
          minimum: 1
          maximum: 6
          description: Viewer-specific bounded interaction weight; excludes anonymous activity and other likers.
        strength:
          type: string
          enum: [LIGHT, MEDIUM, STRONG]
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
      required:
      - from
      - to
      - weight
      - strength
    Graph:
      type: object
      additionalProperties: false
      properties:
        self:
          $ref: '#/components/schemas/Self'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Edge'
        truncated: *id004
      required:
      - self
      - nodes
      - edges
      - truncated
  responses:
    Error:
      description: 401 세션, 403 기간/CSRF, 404 대상 비공개/없음, 409 본인 공개 자격, 400 필터, 429 제한, 일시 장애
      content:
        application/json:
          schema:
            $ref: auth.openapi.yaml#/components/schemas/Error
