openapi: 3.1.0
info:
  title: TAG ME 페이즈 3 참여 API
  version: 0.5.5
  description: Mattermost 가져온 identity와 닉네임·한 줄 소개·분류별 관심사 필수 프로필. 링크는 선택, 참여·상세 공개 안내 확인. 비공개/철회 API 없음.
servers:
- url: /api/v1
paths:
  /event:
    get:
      summary: 행사 상태
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
  /policies:
    get:
      summary: 현재 정책과 본인 동의
      security:
      - session: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policies'
        default:
          $ref: '#/components/responses/Error'
  /interests:
    get:
      summary: 관심사 카탈로그
      security:
      - session: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interest'
        default:
          $ref: '#/components/responses/Error'
  /users/me/profile:
    get:
      summary: 본인 프로필/동의/준비 상태
      security:
      - session: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileState'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: 버전 확인 후 프로필 저장
      security:
      - session: []
        csrfCookie: []
        csrfHeader: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileState'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      description: 가져오기 완료와 현재 두 정책 확인 필수. 닉네임만 필수 입력. 이름/지역/반/사진/isPublic은 본문에 받지 않는다. 길이는 Jakarta Size의 UTF-16
        단위.
  /missions:
    get:
      summary: 서버 수집판
      security:
      - session: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        default:
          $ref: '#/components/responses/Error'
  /missions/collection:
    get:
      summary: 서버 수집판
      security:
      - session: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        default:
          $ref: '#/components/responses/Error'
  /missions/show-me/reconcile:
    post:
      summary: NFC 없이 SHOW ME 현재 조건 재평가
      description: 인증·CSRF 필요. OPEN 중 공개 프로필·소개·관심사·현재 두 동의를 검증한다. 신규 지급의 인정/완료 시각은 DB 처리 시각이며 기존 완료는 유지한다. 시작 전·종료 후에는 지급하지 않는다.
      security:
      - session: []
        csrfCookie: []
        csrfHeader: []
      responses:
        '200':
          description: 현재 조건 재평가 결과
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [newlyCompleted]
                properties:
                  newlyCompleted:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /missions/completion:
    get:
      summary: 전체 완료와 운영상 순번
      security:
      - session: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
        default:
          $ref: '#/components/responses/Error'
  /tags/pending:
    get:
      summary: 태그 임시 의도 존재 여부
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pending'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: 태그 hash와 만료를 서버 세션에 임시 저장
      security:
      - csrfCookie: []
        csrfHeader: []
      responses:
        '202':
          description: 성공
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
      description: 익명 요청은 실제 태그를 조회하거나 해금하지 않는다. CSRF 필요. 15분 만료. 응답 본문 없음.
  /tags/inspect:
    post:
      summary: NFC 태그의 미션명·글자 확인 (해금 없음)
      description: 로그인 전에도 CSRF로 조회한다. token을 생략하면 같은 세션의 15분 임시 태그를 읽으며 소비하지 않는다. 활성 태그/미션만 반환하고 프로필·태그 원문/hash·상태·이동 URL은 반환하지 않는다. IP당 분당 30회 제한. 행사 전후에도 메타데이터만 읽으며 해금/완료/접수 기록을 만들지 않는다.
      security:
      - csrfCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
      responses:
        '200':
          description: 활성 태그의 공개 미션 정보
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [missionCode, letter, title]
                properties:
                  missionCode:
                    type: string
                    enum: [SHOW_ME, SYNC_ME, MAKE_A_WISH, FAST_TAP, SAY_SOMETHING]
                  letter:
                    type: string
                    enum: [S, A, F, Y]
                  title:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /tags/resolve:
    post:
      summary: 태그 검증 후 본인 미션 해금
      security:
      - session: []
        csrfCookie: []
        csrfHeader: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResult'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
  /tags/resume:
    post:
      summary: 서버 세션의 임시 태그로 이어가기
      security:
      - session: []
        csrfCookie: []
        csrfHeader: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResult'
        default:
          $ref: '#/components/responses/Error'
      description: 성공 후 임시 의도를 삭제. 만료 시 404. 요청 본문에 토큰이나 외부 복귀 URL을 받지 않는다.
  /users/me/photo:
    get:
      summary: 본인 Mattermost 프로필 사진
      description: 가져오기/사진 버전 확인, 분당 60회. 외부 통신 후 현재 세션·계정 상태 재검사. 사진 없음 404, 외부 오류 503.
      security:
      - session: []
      responses:
        '200':
          description: no-store/nosniff PNG, 최대 1MiB
          content:
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    Event:
      type: object
      additionalProperties: false
      properties:
        status:
          enum:
          - NOT_CONFIGURED
          - BEFORE_OPEN
          - OPEN
          - CLOSED
        opensAt:
          type:
          - string
          - 'null'
          format: date-time
        submitClosesAt:
          type:
          - string
          - 'null'
          format: date-time
        profilePreparationEnabled:
          type: boolean
      required:
      - status
      - opensAt
      - submitClosesAt
      - profilePreparationEnabled
    PolicyType:
      type: string
      enum:
      - PARTICIPATION
      - PROFILE_PUBLICATION
    Policy:
      type: object
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/PolicyType'
        version:
          type: string
        title:
          type: string
        body:
          type: string
        agreed:
          type: boolean
      required:
      - type
      - version
      - title
      - body
      - agreed
    Policies:
      type: object
      additionalProperties: false
      properties:
        ready:
          type: boolean
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
      required:
      - ready
      - policies
    Interest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum:
          - INDUSTRY
          - DEVELOPMENT
          - TECH_STACK
        groupName:
          type: [string, 'null']
      required:
      - id
      - name
      - category
      - groupName
    Profile:
      type: object
      additionalProperties: false
      properties:
        nickname:
          type: string
        bio:
          type:
          - string
          - 'null'
        githubUrl:
          type:
          - string
          - 'null'
        blogUrl:
          type:
          - string
          - 'null'
        version:
          type: integer
        interestIds:
          type: array
          items:
            type: integer
      required:
      - nickname
      - bio
      - githubUrl
      - blogUrl
      - version
      - interestIds
    ProfileState:
      type: object
      additionalProperties: false
      properties:
        profile:
          anyOf:
          - $ref: '#/components/schemas/Profile'
          - type: 'null'
        consents:
          $ref: '#/components/schemas/Policies'
        profileComplete:
          type: boolean
        participationReady:
          type: boolean
        identity:
          $ref: '#/components/schemas/Identity'
      required:
      - identity
      - profile
      - consents
      - profileComplete
      - participationReady
    Acceptance:
      type: object
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/PolicyType'
        version:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
      required:
      - type
      - version
    ProfileRequest:
      type: object
      additionalProperties: false
      description: 산업 1~3개·개발 분야 1~3개·기술 스택 1~10개. 중복·비활성 항목·공백 소개 거절.
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 30
        bio:
          type: string
          minLength: 1
          maxLength: 200
        githubUrl:
          type:
          - string
          - 'null'
          maxLength: 2048
        blogUrl:
          type:
          - string
          - 'null'
          maxLength: 2048
        expectedVersion:
          type: integer
          minimum: 0
        interestIds:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 3
          maxItems: 16
          uniqueItems: true
        acceptPolicies:
          type: array
          items:
            $ref: '#/components/schemas/Acceptance'
          maxItems: 2
      required:
      - nickname
      - bio
      - expectedVersion
      - interestIds
      - acceptPolicies
    MissionCode:
      type: string
      enum:
      - SHOW_ME
      - SYNC_ME
      - MAKE_A_WISH
      - FAST_TAP
      - SAY_SOMETHING
    Mission:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        code:
          $ref: '#/components/schemas/MissionCode'
        letter:
          type: string
        title:
          type: string
        hint:
          type: string
        active:
          type: boolean
        state:
          enum:
          - LOCKED
          - UNLOCKED
          - IN_PROGRESS
          - COMPLETED
        unlockedAt:
          type:
          - string
          - 'null'
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - code
      - letter
      - title
      - hint
      - active
      - state
      - unlockedAt
      - completedAt
    Completion:
      type: object
      additionalProperties: false
      properties:
        complete:
          type: boolean
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        completionOrder:
          type:
          - integer
          - 'null'
        awardConfirmed:
          const: false
      required:
      - complete
      - completedAt
      - completionOrder
      - awardConfirmed
    Collection:
      type: object
      additionalProperties: false
      properties:
        resetGeneration:
          type: integer
          format: int64
          minimum: 0
        missions:
          type: array
          items:
            $ref: '#/components/schemas/Mission'
        completedCount:
          type: integer
          minimum: 0
          maximum: 5
        completion:
          $ref: '#/components/schemas/Completion'
      required:
      - missions
      - completedCount
      - completion
      - resetGeneration
    TagRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32-byte canonical Base64URL; never include actual event tokens in examples.
      required:
      - token
    TagResult:
      type: object
      additionalProperties: false
      properties:
        missionCode:
          $ref: '#/components/schemas/MissionCode'
        state:
          enum:
          - LOCKED
          - UNLOCKED
          - IN_PROGRESS
          - COMPLETED
        route:
          type: string
          pattern: ^(/me/profile|/missions/(sync-me|make-a-wish|fast-tap|say-something))$
          description: SHOW_ME는 /me/profile만, 나머지 코드는 해당 미션 경로만 반환한다.
        newlyUnlocked:
          type: boolean
        newlyCompleted:
          type: boolean
      required:
      - missionCode
      - state
      - route
      - newlyUnlocked
      - newlyCompleted
    Pending:
      type: object
      additionalProperties: false
      properties:
        present:
          type: boolean
      required:
      - present
    Identity:
      type: object
      additionalProperties: false
      properties:
        realName:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
        classNo:
          type:
          - integer
          - 'null'
        photoUrl:
          type:
          - string
          - 'null'
          description: 같은 origin /api/v1/users/me/photo?v=숫자. 외부 ID/URL 미포함.
        ready:
          type: boolean
      required:
      - realName
      - region
      - classNo
      - photoUrl
      - ready
  responses:
    Error:
      description: 400 형식, 401 인증/버전, 403 CSRF/기간/해금, 404 태그/임시 연결, 409 프로필·정책·조건, 429 제한, 503 설정/저장소
      headers:
        Retry-After:
          schema:
            type: integer
          description: 429에서 재시도 대기 초
      content:
        application/json:
          schema:
            $ref: ./auth.openapi.yaml#/components/schemas/Error
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: TAGME_SESSION
    csrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
