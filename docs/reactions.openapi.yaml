openapi: 3.1.0
info:
  title: TAG ME 소원 댓글과 응원 하트 API
  version: 0.4.3
  description: 읽기는 세션, 쓰기는 CSRF/해금/행사/현재 프로필·동의 필요. 부모·작성자의 현재 공개 상태 필터. 댓글 승인은 미션
    추가 완료와 분리.
servers:
- url: /api/v1
paths:
  /wishes/{id}/comments:
    get:
      summary: 승인된 공개 소원의 승인 댓글
      security:
      - session: []
      parameters:
      - &id001
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - &id002
        name: cursor
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comments'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: 댓글 비공개 접수
      security:
      - session: []
      parameters:
      - *id001
      - &id003
        name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
      responses:
        '202':
          description: 검수 접수; 공개/추가 미션 완료 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnComment'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
  /wishes/{id}/comments/me:
    get:
      summary: 본인 댓글 내역; 부모 비공개여도 본인 정보만 반환
      security:
      - session: []
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnComments'
        default:
          $ref: '#/components/responses/Error'
  /cheers/{id}/like:
    get:
      summary: 본인 하트/현재 집계/쓰기 가능 여부
      security:
      - session: []
      parameters:
      - *id001
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: 멱등 등록; 자기 카드 금지
      security:
      - session: []
      parameters:
      - *id001
      - *id003
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: 멱등 취소; 제출 마감 뒤 쓰기 금지
      security:
      - session: []
      parameters:
      - *id001
      - *id003
      responses:
        '204':
          description: 성공
        default:
          $ref: '#/components/responses/Error'
  /cheers/likes:
    get:
      summary: 최대 20개 카드의 공개 하트 상태; 비공개/다른 종류는 생략
      security:
      - session: []
      parameters:
      - name: ids
        in: query
        required: true
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/LikeState'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: TAGME_SESSION
  schemas:
    CommentInput:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 200
        revealProfile: &id004
          type: boolean
      required:
      - content
      - revealProfile
    PublicComment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        revealProfile: *id004
        nickname:
          type:
          - string
          - 'null'
        profileId:
          type:
          - integer
          - 'null'
          format: int64
      required:
      - id
      - content
      - revealProfile
      - nickname
      - profileId
    OwnComment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        revealProfile: *id004
        status:
          type: string
          enum:
          - QUEUED
          - PROCESSING
          - APPROVED
          - REJECTED
          - REVIEW_REQUIRED
          - SUPERSEDED
        reason:
          type:
          - string
          - 'null'
        submittedAt:
          type: string
          format: date-time
        requestKey:
          type: string
      required:
      - id
      - content
      - revealProfile
      - status
      - reason
      - submittedAt
      - requestKey
    LikeState:
      type: object
      additionalProperties: false
      properties:
        liked: *id004
        count:
          type: integer
          format: int64
          minimum: 0
        canLike: *id004
      required:
      - liked
      - count
      - canLike
    Comments:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PublicComment'
        nextCursor:
          type:
          - integer
          - 'null'
          format: int64
      required:
      - items
      - nextCursor
    OwnComments:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/OwnComment'
        nextCursor:
          type:
          - integer
          - 'null'
          format: int64
      required:
      - items
      - nextCursor
  responses:
    Error:
      description: 세션/CSRF/미해금/행사/공개 상태/입력·키 충돌/속도 제한
      content:
        application/json:
          schema:
            $ref: auth.openapi.yaml#/components/schemas/Error
