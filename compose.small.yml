# Optional resource budget for a 2 GiB VM. Append after the dev OR prod override.
# These are runtime limits; build images on a development machine/CI.
services:
  mysql:
    mem_limit: 640m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=60
      - --table-open-cache=256
      - --temptable-max-ram=64M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --performance-schema=OFF
  redis:
    mem_limit: 192m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
  api:
    mem_limit: 768m
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -Duser.timezone=UTC
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
  web:
    mem_limit: 96m
