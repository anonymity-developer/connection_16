spring:
  application:
    name: tagme-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:tagme}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:tagme}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false
  session:
    timeout: 4h
    redis:
      namespace: tagme:session
      repository-type: indexed
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: TAGME_SESSION
        http-only: true
        secure: ${APP_SESSION_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

# Disabled until an operator provides the real integration credentials.
tagme:
  moderation:
    provider: ${TAGME_MODERATION_PROVIDER:NONE}
    gms-base-url: ${TAGME_GMS_BASE_URL:}
    gms-key: ${GMS_KEY:}
    openai-key: ${OPENAI_API_KEY:}
  auth:
    enabled: ${AUTH_ENABLED:false}
    base-url: ${MATTERMOST_BASE_URL:https://meeting.ssafy.com}
    token: ${MATTERMOST_TOKEN:}
    channel-id: ${MATTERMOST_CHANNEL_ID:}
    hmac-key: ${AUTH_HMAC_KEY:}
    otp-ttl-seconds: ${AUTH_OTP_TTL_SECONDS:180}
    resend-seconds: ${AUTH_RESEND_SECONDS:60}
    otp-max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
    otp-account-limit: ${AUTH_OTP_ACCOUNT_LIMIT:5}
    login-account-limit: ${AUTH_LOGIN_ACCOUNT_LIMIT:10}
    ip-per-minute: ${AUTH_IP_PER_MINUTE:120}
