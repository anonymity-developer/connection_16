spring:
  application:
    name: tagme-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:tagme}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:tagme}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false
  session:
    timeout: 2h
    redis:
      namespace: tagme:session
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: TAGME_SESSION
        http-only: true
        secure: ${APP_SESSION_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
