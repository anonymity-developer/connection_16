# Local ports are bound to loopback. Use with -f compose.yml -f compose.dev.yml.
services:
  mysql:
    ports: ["127.0.0.1:${MYSQL_PORT:-3306}:3306"]
  redis:
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
  api:
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
  web:
    ports: ["127.0.0.1:${WEB_PORT:-8088}:80"]
